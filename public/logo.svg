<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Blue rounded background -->
  <rect width="64" height="64" rx="14" fill="#2563EB"/>

  <!-- Option 1: unselected -->
  <circle cx="19" cy="18" r="5" stroke="white" stroke-width="1.8" opacity="0.55"/>
  <rect x="29" y="15" width="24" height="6" rx="3" fill="white" opacity="0.4"/>

  <!-- Option 2: selected (white circle + blue checkmark + bright text bar) -->
  <circle cx="19" cy="32" r="6" fill="white"/>
  <path d="M16 32.5 L18.5 35 L23 28.5" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="29" y="29" width="24" height="6" rx="3" fill="white"/>

  <!-- Option 3: unselected -->
  <circle cx="19" cy="46" r="5" stroke="white" stroke-width="1.8" opacity="0.55"/>
  <rect x="29" y="43" width="24" height="6" rx="3" fill="white" opacity="0.4"/>
</svg>
